[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manga-dialogue-pipeline"
version = "0.1.0"
description = "Extract dialogue and coordinates from manga pages, link speakers, and search locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "S治" }]
dependencies = [
  "google-genai>=1.0.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
manga-pipeline = "manga_dialogue_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_dialogue_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "manga_dialogue_pipeline/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
